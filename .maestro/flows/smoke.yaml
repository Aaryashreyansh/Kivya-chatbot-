appId: com.aarya.kivya
---
- launchApp
- extendedWaitUntil:
    visible: "KIVYA"
    timeout: 30000
- assertVisible: "AI ASSISTANT"
- assertNotVisible: "HEY KIVYA"
- assertNotVisible: "STOP WAKE WORD"
- assertVisible: "Message KIVYA..."
- assertVisible: "TALK TO KIVYA"
- scrollUntilVisible:
    element:
      text: "CONVERSATION"
    direction: DOWN
    timeout: 10000
- assertVisible: "CONVERSATION"
