name: Android CI
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Fetch checksum-pinned Sherpa-ONNX Android runtime
        run: |
          mkdir -p app/libs
          curl --fail --location --retry 3 \\
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar \\
            --output app/libs/sherpa-onnx-2.0.1.aar
          echo "a8d09d1d32f3eb8520482c6d3d43fae674681c5b050385967c70a3c2c9bf0ee7  app/libs/sherpa-onnx-2.0.1.aar" | sha256sum --check
      - name: Build debug and optimized test release APKs
        run: gradle assembleDebug assembleRelease
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kivya-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload optimized test release APK
        uses: actions/upload-artifact@v4
        with:
          name: kivya-test-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish public APK release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta
          name: KIVYA Beta
          body: |
            KIVYA Android test build.
            Install the Debug APK on your Android device.
            This is a test release; background wake-word support is not included yet.
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: true
          overwrite_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
