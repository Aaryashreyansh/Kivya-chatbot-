name: Android CI
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug and optimized test release APKs
        run: gradle assembleDebug assembleRelease
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kivya-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload optimized test release APK
        uses: actions/upload-artifact@v4
        with:
          name: kivya-test-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish public APK release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta
          name: KIVYA Beta
          body: |
            KIVYA Android test build.
            Install the Debug APK on your Android device.
            This is a test release; background wake-word support is not included yet.
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: true
          overwrite_files: true
