name: KIVYA UI Smoke Test

on:
  workflow_run:
    workflows: ["Android CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  maestro-smoke-test:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download debug APK from Android CI
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: kivya-debug-apk
          path: artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download latest beta APK for manual run
        if: github.event_name == 'workflow_dispatch'
        run: |
          gh release download beta --pattern 'app-debug.apk' --dir artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run KIVYA on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: |
            adb install -r artifacts/app-debug.apk
            maestro test .maestro/flows/smoke.yaml
