name: KIVYA UI Smoke Test

on:
  workflow_run:
    workflows: ["Android CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

# Only one emulator UI test at a time. This prevents overlapping emulator
# sessions from exhausting runner resources and killing Maestro's device server.
concurrency:
  group: kivya-maestro-ui
  cancel-in-progress: true

jobs:
  maestro-smoke-test:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download debug APK from Android CI
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: kivya-debug-apk
          path: artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download latest beta APK for manual run
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p artifacts
          gh release download beta --pattern 'app-debug.apk' --dir artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android emulator packages
        shell: bash
        run: |
          sdkmanager --install "platform-tools" "emulator" "system-images;android-34;google_apis;x86_64"
          echo "no" | avdmanager create avd --force -n kivya-api34 -k "system-images;android-34;google_apis;x86_64" -d pixel_2

      - name: Boot Android emulator
        shell: bash
        run: |
          set -euo pipefail
          nohup emulator -avd kivya-api34 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data > /tmp/kivya-emulator.log 2>&1 &
          echo $! > /tmp/kivya-emulator.pid
          adb wait-for-device
          booted=false
          for attempt in $(seq 1 120); do
            state="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            if [ "$state" = "1" ]; then booted=true; break; fi
            sleep 5
          done
          if [ "$booted" != "true" ]; then
            cat /tmp/kivya-emulator.log
            echo "Android emulator did not finish booting within 10 minutes"
            exit 1
          fi
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb devices -l

      - name: Run KIVYA UI smoke test
        shell: bash
        run: |
          set -euo pipefail
          export MAESTRO_DRIVER_STARTUP_TIMEOUT=240000
          export MAESTRO_CLI_NO_ANALYTICS=true
          adb install -r artifacts/app-debug.apk
          adb shell pm grant com.aarya.kivya android.permission.RECORD_AUDIO
          adb shell pm grant com.aarya.kivya android.permission.POST_NOTIFICATIONS || true
          adb shell monkey -p com.aarya.kivya 1
          sleep 15
          adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' || true
          maestro test .maestro/flows/smoke.yaml

      - name: Capture emulator diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p test-results
          adb logcat -d -t 5000 > test-results/logcat.txt 2>&1 || true
          adb shell dumpsys activity activities > test-results/activities.txt 2>&1 || true
          cp /tmp/kivya-emulator.log test-results/emulator.log 2>/dev/null || true

      - name: Upload Maestro debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kivya-maestro-debug-${{ github.run_number }}
          path: /home/runner/.maestro/tests/
          if-no-files-found: warn
          retention-days: 7
