name: KIVYA UI Smoke Test

on:
  workflow_run:
    workflows: ["Android CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

# Only one emulator UI test at a time. This prevents overlapping emulator
# sessions from exhausting runner resources and killing Maestro's device server.
concurrency:
  group: kivya-maestro-ui
  cancel-in-progress: true

jobs:
  maestro-smoke-test:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download debug APK from Android CI
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: kivya-debug-apk
          path: artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download latest beta APK for manual run
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p artifacts
          gh release download beta --pattern 'app-debug.apk' --dir artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run KIVYA on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            adb wait-for-device
            adb shell getprop sys.boot_completed
            adb shell pm list packages | grep com.aarya.kivya
            adb install -r artifacts/app-debug.apk
            adb shell monkey -p com.aarya.kivya 1
            sleep 15
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' || true
            maestro test .maestro/flows/smoke.yaml

      - name: Upload Maestro debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kivya-maestro-debug-${{ github.run_number }}
          path: /home/runner/.maestro/tests/
          if-no-files-found: warn
          retention-days: 7
